name: Weekly upstream check

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Stable Syncthing release tag, for example v2.1.2'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-upstream-check
  cancel-in-progress: false

jobs:
  check-and-propose:
    runs-on: ubuntu-latest
    env:
      BOT_BRANCH: automation/upstream-sync
      UPSTREAM_REPO: sammonsempes/syncthing4swarm
      FORCE_VERSION: ${{ inputs.force_version }}
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure remotes and identity
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --prune origin main
          git fetch --prune upstream main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Resolve upstream Syncthing release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$FORCE_VERSION" ]; then
            version="$FORCE_VERSION"
          else
            version=$(gh api repos/syncthing/syncthing/releases --paginate --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name')
          fi
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid stable release tag: $version" >&2; exit 1 ;;
          esac
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved Syncthing release: $version"

      - name: Prepare clean proposal branch
        run: |
          git checkout -B "$BOT_BRANCH" origin/main
          git merge --no-edit --no-ff upstream/main || {
            echo 'Upstream merge conflict; leaving the fork untouched for manual resolution.' >&2
            git merge --abort || true
            exit 1
          }
          printf '%s\n' '${{ steps.version.outputs.version }}' > .github/syncthing-version
          if git diff --quiet HEAD -- .github/syncthing-version && git diff --quiet HEAD origin/main; then
            echo 'changed=false' >> "$GITHUB_ENV"
          else
            echo 'changed=true' >> "$GITHUB_ENV"
          fi

      - name: Install validation tools
        if: env.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell and Compose files
        if: env.changed == 'true'
        run: |
          shellcheck dev/entrypoint.sh
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f dev/docker-compose-dev.yml config >/dev/null
          test -z "$(git ls-files | grep -E '(^|/)(\.env|.*\.secret|.*\.pem|.*\.key)$' || true)"

      - name: Build amd64 validation image
        if: env.changed == 'true'
        run: |
          docker buildx build --platform linux/amd64 --build-arg SYNCTHING_VERSION=${{ steps.version.outputs.version }} --tag syncthing4swarm:upstream-check ./dev

      - name: Push proposal branch
        if: env.changed == 'true'
        run: git push --force-with-lease origin "$BOT_BRANCH"

      - name: Create or update pull request
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="chore: sync upstream and Syncthing ${{ steps.version.outputs.version }}"
          body=$(cat <<'EOF'
          ## Automated upstream proposal

          This PR was generated by the weekly upstream check.

          - Source upstream: `sammonsempes/syncthing4swarm`
          - Syncthing release: `${{ steps.version.outputs.version }}`
          - Validation: shellcheck, Compose config validation, amd64 image build

          Review all upstream changes against the fork's manager-only deployment, private discovery, conflict retention, and public-asset rules before merging.
          EOF
          )
          existing=$(gh pr list --head "$BOT_BRANCH" --base main --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            gh pr create --head "$BOT_BRANCH" --base main --title "$title" --body "$body"
          fi

      - name: Report no changes
        if: env.changed != 'true'
        run: echo 'No upstream source or Syncthing release changes detected.'
