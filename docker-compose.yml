networks:
  syncthing4swarm:
    driver: overlay
    internal: true

services:
  syncthing4swarm:
    image: ghcr.io/zlwu/syncthing4swarm:latest
    volumes:
      # Keep Syncthing's own identity/configuration local to each Swarm node.
      - /var/lib/syncthing4swarm/config:/var/syncthing/config
      # Only this directory is replicated between trusted manager nodes.
      - /opt/swarm-stacks:/var/syncthing/data
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
    environment:
      # Set this in the deployment environment; never commit a real key.
      - STGUIAPIKEY=${STGUIAPIKEY:-change-me-in-local-env}
      - SYNCTHING_PORT=${SYNCTHING_PORT:-8384}
      - SYNCTHING_SYNC_PORT=${SYNCTHING_SYNC_PORT:-22000}
      - SYNCTHING_FOLDER_ID=${SYNCTHING_FOLDER_ID:-swarm-stacks}
      - SYNCTHING_FOLDER_PATH=${SYNCTHING_FOLDER_PATH:-/var/syncthing/data}
      - SYNCTHING_FOLDER_LABEL=${SYNCTHING_FOLDER_LABEL:-Swarm deployment control}
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - UMASK=${UMASK:-077}
    networks:
      - syncthing4swarm
